{{ define "main" }}
<section class="syn-region syn-stack syn-semantic">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul>
    {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ with .Description }} — {{ . }}{{ end }}</li>
    {{ end }}
  </ul>
</section>
{{ end }}
