# Run manually before a candidate release or when a version tag is pushed.
# Browser tooling is development-only and is not shipped to consumers.
when:
  - event: manual
  - event: tag

steps:
  - name: three-engine-browser-and-reflow-matrix
    image: mcr.microsoft.com/playwright/python:v1.65.2-noble@sha256:38dd67fc654b56b3cba611e4c8eb71cd33750e1cd29eea2a5dc00b484817a75f
    commands:
      - python3 -m pip install --disable-pip-version-check playwright==1.65.2
      - python3 tests/browser_test.py
      - python3 tests/site_builder_browser.py
      - python3 tests/site_builder_upload_race_browser.py
      - python3 tests/synced_components_browser.py
      - python3 tests/browser_matrix.py --browsers chromium firefox webkit
      - python3 tests/progressive_reliability_browser.py --browsers chromium firefox webkit
      - python3 tests/accessibility_regression_browser.py --browsers chromium firefox webkit
      - python3 tests/blocks_browser.py --browsers chromium firefox webkit
      - python3 tests/reflow_test.py --browsers chromium firefox webkit
      - python3 tests/published_reflow_browser.py --browsers chromium firefox webkit
      - python3 tests/theme_editor_browser.py
      - python3 tests/playground_browser.py chromium
      - python3 tests/playground_browser.py firefox
      - python3 tests/playground_browser.py webkit
      - python3 scripts/build_cloudflare_site.py
      - python3 tests/security_headers_browser.py --browsers chromium firefox webkit
