# Optional framework-consumer verification. This pipeline uses Node.js only
# for development tests; it never changes the CSS runtime or its Python-only gate.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: node-jsx-tsx-consumers
    # Preserve the optional consumer check while skipping npm for unrelated changes.
    # A manual invocation always runs the full set of adoption fixtures.
    when:
      - event: manual
      - event: [pull_request, push]
        path:
          include:
            - src/**
            - dist/**
            - package.json
            - packages/react/**
            - examples/react-vite/**
            - examples/preact-jsx/**
            - examples/solid-tsx/**
            - examples/next-app-router/**
            - examples/node-express/**
            - integrations/**
            - scripts/build.py
            - scripts/export_ecosystem_adapters.py
            - scripts/test_js_adoption.py
            - tests/test_node_react_next_adoption.py
            - tests/genui_browser.test.mjs
            - tests/animate.test.mjs
            - tests/copy.test.mjs
            - tests/ascii_playground.test.mjs
            - tests/ascii_cli.test.mjs
            - scripts/compose.mjs
            - tests/compose_cli.test.mjs
            - tests/compose_intent.test.mjs
            - docs/page-builder-model.mjs
            - metadata/section-composer.v1.json
            - scripts/ascii.mjs
            - tools/ascii-logic.mjs
            - tools/ascii-playground*
            - .woodpecker/js-adoption.yaml
          on_empty: true
    image: node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    commands:
      - node --version && npm --version
      - node --test tests/animate.test.mjs tests/copy.test.mjs tests/ascii_playground.test.mjs tests/ascii_cli.test.mjs tests/compose_cli.test.mjs tests/compose_intent.test.mjs tests/genui_browser.test.mjs
      - npm ci --prefix packages/react --ignore-scripts --no-audit --no-fund
      - npm test --prefix packages/react
      - npm ci --prefix examples/react-vite --ignore-scripts --no-audit --no-fund
      - npm run build --prefix examples/react-vite
      - npm ci --prefix examples/preact-jsx --ignore-scripts --no-audit --no-fund
      - npm run build --prefix examples/preact-jsx
      - npm ci --prefix examples/solid-tsx --ignore-scripts --no-audit --no-fund
      - npm run build --prefix examples/solid-tsx
      - npm ci --prefix examples/next-app-router --ignore-scripts --no-audit --no-fund
      - npm run build --prefix examples/next-app-router
      - npm ci --prefix examples/node-express --ignore-scripts --no-audit --no-fund
      - npm test --prefix examples/node-express
