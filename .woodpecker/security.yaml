# Optional development environments only; the distributed CSS has no npm deps.
# Discover every checked-out npm lockfile; fail on high/critical advisories or audit errors.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: audit-optional-dependency-lockfiles
    image: node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    commands:
      - node --version && npm --version
      - node --test tests/audit_npm_lockfiles.test.mjs tests/form_builder_model.test.mjs tests/page_builder_custom_media.test.mjs tests/site_builder_model.test.mjs
      - node scripts/audit_npm_lockfiles.mjs
