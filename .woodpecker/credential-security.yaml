# Full history pilot; verify runner GitHub egress before requiring PR status.
when:
  - event: manual
  - event: tag

steps:
  - name: gitleaks-history
    image: python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*
      - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --no-tags origin; fi
      - curl --fail --silent --show-error --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
      - printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb /tmp/gitleaks.tar.gz | sha256sum -c
      - mkdir -p /tmp/gitleaks-bin && tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - GITLEAKS=/tmp/gitleaks-bin/gitleaks python3 -m unittest discover -s tests -p test_credential_audit.py -v
      - GITLEAKS=/tmp/gitleaks-bin/gitleaks sh scripts/audit_repository_secrets.sh
