<section class="syn-root syn-region" data-syn-theme="studio" aria-labelledby="syn-inquiry">
  <h2 id="syn-inquiry" class="syn-heading">Tell us about your project</h2>
  <form class="syn-panel syn-form" action="/contact/request" method="post">
    <div class="syn-field"><label class="syn-label" for="syn-inquiry-name">Your name</label>
      <input class="syn-input" id="syn-inquiry-name" name="name" autocomplete="name" required></div>
    <div class="syn-field"><label class="syn-label" for="syn-inquiry-email">Email address</label>
      <input class="syn-input" id="syn-inquiry-email" name="email" type="email" autocomplete="email" required></div>
    <div class="syn-field"><label class="syn-label" for="syn-inquiry-details">Project details</label>
      <textarea class="syn-input" id="syn-inquiry-details" name="details" rows="3" required></textarea></div>
    <button class="syn-button syn-button--primary" type="submit">Request a conversation</button>
  </form>
  <p class="syn-caption">Sample form only. Add consent, anti-spam, CSRF and server validation in your application.</p>
</section>
