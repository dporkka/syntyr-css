<section class="syn-root syn-region" data-syn-theme="studio" aria-labelledby="syn-newsletter">
  <div class="syn-panel">
    <p class="syn-eyebrow">STAY IN THE LOOP</p><h2 id="syn-newsletter" class="syn-heading">A useful note, once a month</h2>
    <p>Design patterns, maintenance tips and new articles. Unsubscribe at any time.</p>
    <form class="syn-form" action="/newsletter/subscribe" method="post">
      <div class="syn-field"><label class="syn-label" for="syn-newsletter-email">Email address</label>
        <input class="syn-input" type="email" id="syn-newsletter-email" name="email" autocomplete="email" required></div>
      <button class="syn-button syn-button--primary" type="submit">Subscribe</button>
    </form>
    <p class="syn-caption">Connect a real consent-aware endpoint, CSRF protection and confirmation flow before publishing.</p>
  </div>
</section>
