<section class="syn-root syn-region" data-syn-theme="studio" aria-labelledby="syn-signin-heading">
  <div class="syn-panel">
    <h2 class="syn-heading" id="syn-signin-heading">Sign in to Northstar</h2>
    <p class="syn-muted">Use your account credentials. Authentication is implemented by your application.</p>
    <form class="syn-form" method="post" action="/sign-in">
      <label class="syn-label" for="syn-signin-email">Email address</label>
      <input class="syn-input" id="syn-signin-email" name="email" type="email" autocomplete="username" required>
      <label class="syn-label" for="syn-signin-password">Password</label>
      <input class="syn-input" id="syn-signin-password" name="password" type="password" autocomplete="current-password" required>
      <button class="syn-button syn-button--primary" type="submit">Sign in</button>
    </form>
    <p class="syn-caption"><a href="/password/forgot">Forgot password?</a> · <a href="/sign-up">Create account</a></p>
  </div>
</section>
